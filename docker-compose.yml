# docker compose for the Local LLM Gateway.
#
#   migrate — one-off `alembic upgrade head`, runs to completion before the app
#   gateway — the FastAPI front door on :8000
#
# Postgres and Ollama are NOT in this stack — both are EXTERNAL services that
# already run outside Docker. The containers reach them via host.docker.internal
# (mapped to the host gateway by `extra_hosts`, required on Linux), or via a real
# hostname/IP if the DB lives on another machine. Set both in .env.docker.
#
# Usage:
#   cp .env.docker.example .env.docker   # then set JWT_SECRET + real DB creds
#   docker compose up --build
#
# Config comes entirely from .env.docker (never bake secrets into the image).

services:
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env.docker
    restart: "no"
    # Reach the host's Postgres (and anything else on the host) by name.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  gateway:
    build:
      context: .
      args:
        # Image OCR for chat uploads (the read_image tool). Default ON via the
        # COMPOSE default, because this is a build arg and a build arg cannot be
        # fed by .env.docker (that is env_file = RUNTIME) — so a per-server
        # runtime file could never turn it on. The tracked compose file is the
        # only thing that both travels to the server AND feeds the build.
        # ~270 MB (rapidocr + onnxruntime + opencv), CPU-only, never touches the
        # GPU. For a slim build that never OCRs: INSTALL_OCR=false docker compose
        # build. The raw Dockerfile ARG stays false, so a bare `docker build .`
        # is still slim — only the compose (deployment) path carries OCR. See
        # docs/image-ocr.md.
        INSTALL_OCR: ${INSTALL_OCR:-true}
    env_file: .env.docker
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Lets the container reach the host's Postgres (:5432), Ollama (:11434) and
    # MCP server (:3333) as host.docker.internal.
    # Required on Linux; harmless on Docker Desktop (Mac/Windows).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Persist generated files (create_excel / create_html / …) across restarts.
    volumes:
      - gateway_files:/app/generated_files
      - rag_documents:/app/rag_documents          # shared with worker
      # Serving a chat citation's source document. Since §28 an NRB document has
      # NO copy under rag_documents — its bytes are only here.
      - nrb_files:/app/nrb_files

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        # GPL-3 gate, default OFF (see Dockerfile.worker). An NRB deployment
        # sets INSTALL_LEGACY_FONT=true in the shell or .env; without it every
        # legacy-font page is recorded unresolved instead of converted, which is
        # safe but recovers nothing.
        INSTALL_LEGACY_FONT: ${INSTALL_LEGACY_FONT:-false}
    env_file: .env.docker
    depends_on:
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - rag_documents:/app/rag_documents          # SAME volume the gateway writes
      # Reads NRB blobs during recovery/ingest (worker._document_path). Without
      # this the job SUCCEEDS with an empty document — the §18 failure shape.
      - nrb_files:/app/nrb_files
      - worker_cache:/home/appuser/.cache         # persist Docling models

  nrb-runner:
    # NRB pipeline staging: sync -> fetch -> extract -> RAG enqueue, and nothing
    # else. It runs on the GATEWAY image on purpose — httpx, pypdf, openpyxl and
    # python-docx are all in requirements.txt, and it must NOT acquire **Docling**.
    # Recovery, chunking, embedding and supersession stay the `worker` service's;
    # these two processes have two jobs.
    #
    # Note since image OCR landed: with INSTALL_OCR=true this image does carry
    # rapidocr, because it is the same image as the gateway. That is harmless and
    # not a hole in the rule above — NRB page recovery goes through
    # app/nrb/ocr.py, which reaches PP-OCRv5 via **docling** and is still absent
    # here, so this process cannot recover a page whatever is installed. What it
    # must never gain is docling/torch.
    #
    # Same image, different command: the API accepts runs, this executes them, so
    # a gateway restart cannot lose an accepted one.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Same default as gateway (they share the image). Kept in lockstep so the
        # two never diverge into an OCR-mismatched pair of the same build.
        INSTALL_OCR: ${INSTALL_OCR:-true}
    command: ["python", "-m", "app.nrb.runner"]
    env_file: .env.docker
    depends_on:
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - rag_documents:/app/rag_documents          # the RAG stage copies into it
      # WRITES the blobs (the Phase 5 fetch). The other two only read them, so
      # all three must mount the same volume at the same path or the corpus
      # exists three times and is empty twice.
      - nrb_files:/app/nrb_files

volumes:
  gateway_files:
  rag_documents:
  # The NRB blob store. Written by nrb-runner (Phase 5 fetch), read by worker
  # (recovery + ingest) and by gateway (serving a citation's download). Since §28
  # there is no rag_documents copy of an NRB file, so this volume IS the corpus's
  # bytes — losing it loses 8.6 GB that would have to be re-downloaded.
  nrb_files:
  worker_cache:
